<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction to Digital Signal Processing — CSD 303 practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --line:#e5e7eb; --accent:#ea580c; --accent-soft:#eef2ff;
  --correct:#16a34a; --correct-bg:#e7f7ec; --wrong:#dc2626; --wrong-bg:#fdeaea;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 240px); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55;
}
.wrap{max-width:820px; margin:0 auto; padding:0 20px 80px}
header.hero{
  background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7c3aed));
  color:#fff; padding:38px 20px 30px; border-radius:0 0 22px 22px;
  box-shadow:0 10px 30px -12px rgba(37,99,235,.5);
}
header.hero .inner{max-width:820px; margin:0 auto; padding:0 20px}
header.hero .kicker{font-size:13px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; margin:0 0 6px}
header.hero h1{margin:0; font-size:28px; font-weight:700; letter-spacing:-.01em}
header.hero p{margin:8px 0 0; opacity:.92; font-size:15px; max-width:620px}
.progress{height:8px; background:rgba(255,255,255,.28); border-radius:99px; overflow:hidden; margin-top:18px}
.progress > span{display:block; height:100%; width:0; background:#fff; border-radius:99px; transition:width .35s ease}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:22px 22px 20px; margin-top:22px; box-shadow:0 6px 22px -16px rgba(15,23,42,.35)}
.qnum{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--accent);
  background:var(--accent-soft); padding:4px 10px; border-radius:99px; margin-bottom:10px}
.qtext{font-size:17px; font-weight:600; margin:0 0 14px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:12px;
  padding:12px 14px; cursor:pointer; transition:border-color .15s, background .15s, transform .05s; font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.995)}
.opt .mk{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto;
  display:grid; place-items:center; font-size:13px; color:#fff; font-weight:700}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.correct{border-color:var(--correct); background:var(--correct-bg)}
.opt.correct .mk{background:var(--correct); border-color:var(--correct)}
.opt.wrong{border-color:var(--wrong); background:var(--wrong-bg)}
.opt.wrong .mk{background:var(--wrong); border-color:var(--wrong)}
.opt.locked{cursor:default}
.feedback{margin-top:14px; padding:14px 16px; border-radius:12px; font-size:14.5px; display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--correct-bg); border:1px solid #bbe9c8; color:#14532d}
.feedback.no{background:var(--wrong-bg); border:1px solid #f3c2c2; color:#7f1d1d}
.feedback b{font-weight:700}
.bar{display:flex; gap:12px; margin-top:30px; align-items:center; flex-wrap:wrap}
button.check, button.submit{
  font:inherit; font-weight:600; border:none; border-radius:11px; padding:12px 22px; cursor:pointer;
  background:var(--accent); color:#fff; box-shadow:0 8px 20px -10px var(--accent); transition:filter .15s, transform .05s}
button.check:hover, button.submit:hover{filter:brightness(1.06)}
button.check:active, button.submit:active{transform:translateY(1px)}
button.check:disabled{background:#cbd5e1; box-shadow:none; cursor:default}
button.submit{background:#111827; box-shadow:0 8px 20px -10px #111827}
.summary{display:none; margin-top:26px; background:linear-gradient(120deg,#111827,#1f2937); color:#fff;
  border-radius:18px; padding:28px; text-align:center}
.summary.show{display:block}
.summary .score{font-size:46px; font-weight:800; line-height:1}
.summary .score small{font-size:18px; font-weight:600; opacity:.8}
.summary .msg{margin-top:10px; font-size:15px; opacity:.92}
.summary .break{margin-top:16px; font-size:13.5px; opacity:.85}
.toc{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:24px}
.toc a{text-decoration:none; color:var(--ink); border:1px solid var(--line); background:#fff; border-radius:14px;
  padding:16px 18px; display:block; transition:transform .12s, box-shadow .15s, border-color .15s}
.toc a:hover{transform:translateY(-2px); box-shadow:0 12px 24px -16px rgba(15,23,42,.4); border-color:var(--accent)}
.toc .t{font-weight:700; font-size:15.5px}
.toc .d{font-size:13px; color:var(--muted); margin-top:5px}
.toc .n{font-size:12px; color:var(--accent); font-weight:700; margin-top:10px}
footer{text-align:center; color:var(--muted); font-size:12.5px; margin-top:40px}
.home{display:inline-block; margin-top:18px; color:var(--accent); font-weight:600; text-decoration:none}
</style>
</head><body>
<header class="hero"><div class="inner">
  <p class="kicker">CSD 303 · Lecture 22</p>
  <h1>Introduction to Digital Signal Processing</h1>
  <p>Sampling, the Nyquist limit, quantization, and bits.</p>
  <div class="progress"><span id="prog"></span></div>
</div></header>
<div class="wrap">
  <div id="quiz"></div>
  <div class="bar" style="justify-content:center"><button class="submit" id="submit">Submit quiz</button></div>
  <div class="summary" id="summary"></div>
  <a class="home" href="index.html">&larr; Back to all practice sets</a>
  <footer>CSD 303 Speech Acoustics &amp; Perception &middot; Fall 2026 &middot; built from lecture slides</footer>
</div>
<script>
const Q = [{"q": "Sampling limits the decimal places in ___ ; quantization limits the decimal places in ___.", "options": ["amplitude / time", "time / amplitude", "frequency / phase", "loudness / pitch"], "answer": 1, "explain": "Analog→digital: sampling picks discrete time points; quantization assigns discrete amplitude values."}, {"q": "The Nyquist frequency for a given sampling rate is...", "options": ["Equal to the sampling rate", "One-half the sampling rate", "Twice the sampling rate", "Zero"], "answer": 1, "explain": "Nyquist = fs/2, the highest frequency that can be captured without aliasing at sampling rate fs."}, {"q": "To capture a signal of frequency f without aliasing, the sampling rate must be at least...", "options": ["Equal to f", "Twice f", "Half of f", "Unrelated to f"], "answer": 1, "explain": "You need ≥ 2 samples per cycle (Nyquist/Shannon): fs ≥ 2f to reconstruct the waveform."}, {"q": "Speech matters up to ~11 kHz, so a safe sampling rate is about...", "options": ["8 kHz", "22 kHz", "44 Hz", "2 kHz"], "answer": 1, "explain": "With Nyquist ≈ 11 kHz, sample near 22 kHz. Lower rates stay intelligible but lose high-frequency detail (e.g., [s] vs [f])."}, {"q": "Aliasing happens when a signal is...", "options": ["Quantized too finely", "Undersampled (below Nyquist), so one frequency mimics another", "Played too loud", "Compressed with lossless codecs"], "answer": 1, "explain": "Undersampling makes a high frequency appear as a lower 'alias' frequency — like Yubin's alias demo."}, {"q": "With n bits of quantization you can represent how many amplitude levels?", "options": ["n", "2^n", "n^2", "10^n"], "answer": 1, "explain": "Each bit doubles the count: n bits → 2^n levels (e.g., 16 bits → 65,536)."}, {"q": "Speech audio is normally quantized at 8, 12, or 16 bits, giving how many levels respectively?", "options": ["8 / 12 / 16", "256 / 4,096 / 65,536", "1,000 / 10,000 / 100,000", "3 / 4 / 5"], "answer": 1, "explain": "2^8=256, 2^12=4096, 2^16=65536 amplitude steps."}, {"q": "Quantization error introduces what into the signal?", "options": ["Echo", "Noise", "Reverb", "Nothing"], "answer": 1, "explain": "Rounding samples to discrete levels adds quantization noise (audible as quality drops at 4 or 2 bits)."}, {"q": "A discrete (digital) signal is discrete in...", "options": ["Time only", "Both time and amplitude", "Amplitude only", "Neither — it's continuous"], "answer": 1, "explain": "Digital signals are discrete in both time (sampling) and amplitude (quantization), unlike continuous analog signals."}];
const answered = new Array(Q.length).fill(false);
const root = document.getElementById('quiz');
const prog = document.getElementById('prog');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
Q.forEach((q, qi)=>{
  const card = document.createElement('div'); card.className='card';
  let opts = q.options.map((o,i)=>`
    <div class="opt" data-i="${i}">
      <span class="mk">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>
    </div>`).join('');
  card.innerHTML = `<span class="qnum">Question ${qi+1}</span>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    <div class="bar"><button class="check">Check answer</button></div>
    <div class="feedback"></div>`;
  root.appendChild(card);
  const optEls = [...card.querySelectorAll('.opt')];
  const btn = card.querySelector('.check');
  const fb = card.querySelector('.feedback');
  let picked = -1;
  optEls.forEach(el=>{
    el.addEventListener('click', ()=>{
      if(answered[qi]) return;
      optEls.forEach(e=>e.classList.remove('sel'));
      el.classList.add('sel'); picked = +el.dataset.i; btn.disabled=false;
    });
  });
  btn.disabled = true;
  btn.addEventListener('click', ()=>{
    if(picked<0 || answered[qi]) return;
    answered[qi]=true;
    const ok = picked === q.answer;
    optEls.forEach((el,i)=>{
      el.classList.add('locked');
      if(i===q.answer) el.classList.add('correct');
      if(i===picked && i!==q.answer) el.classList.add('wrong');
    });
    btn.disabled = true;
    fb.className = 'feedback show ' + (ok?'ok':'no');
    fb.innerHTML = (ok? '<b>Correct!</b> ' : '<b>Not quite.</b> ') + esc(q.explain);
    updateProg();
  });
});
function updateProg(){
  const done = answered.filter(Boolean).length;
  prog.style.width = (done/Q.length*100)+'%';
}
const submit = document.getElementById('submit');
const summary = document.getElementById('summary');
submit.addEventListener('click', ()=>{
  const done = answered.filter(Boolean).length;
  if(done < Q.length){ alert('Please answer all '+Q.length+' questions first ('+done+' done).'); return; }
  // a card is correct iff the user never selected a wrong option
  let correct = 0;
  document.querySelectorAll('.card').forEach(c=>{
    if(!c.querySelector('.opt.wrong')) correct++;
  });
  const pct = Math.round(correct/Q.length*100);
  summary.className='summary show';
  let msg = pct===100? "Flawless — you've got this material cold."
          : pct>=80? "Strong work. Review the ones you missed and you're set."
          : pct>=60? "Solid base — revisit the feedback on the missed items."
          : "Worth another pass through the lecture; read each explanation carefully.";
  summary.innerHTML = `<div class="score">${correct}<small> / ${Q.length}</small></div>
    <div class="msg">${msg}</div>
    <div class="break">${pct}% correct &middot; generated from CSD 303 (Fall 2026) lecture slides</div>`;
  summary.scrollIntoView({behavior:'smooth'});
});
</script>
</body></html>
