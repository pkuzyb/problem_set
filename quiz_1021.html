<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>practice problem set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Georgia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f7f3; --card:#ffffff; --ink:#22301f; --muted:#5b6b56;
  --line:#d4e3cf; --accent:#3b7f3c; --accent-dark:#2b4f2c; --accent-soft:#eaf0ea;
  --correct:#2f8f2f; --correct-bg:#e7f5e7; --wrong:#8a2f2f; --wrong-bg:#f7eaea;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Poppins','Quicksand','Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#eaf0ea 0%,var(--bg) 240px); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
.wrap{max-width:820px; margin:0 auto; padding:0 20px 80px}
header.hero{
  background:linear-gradient(120deg,var(--accent-dark),var(--accent));
  color:#fff; padding:40px 20px 32px; border-radius:0 0 22px 22px;
  box-shadow:0 10px 30px -12px rgba(43,79,44,.5);
}
header.hero .inner{max-width:820px; margin:0 auto; padding:0 20px}
header.hero .kicker{font-size:13px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; margin:0 0 6px; font-weight:600}
header.hero h1{margin:0; font-size:29px; font-weight:700; letter-spacing:-.01em; font-family:'Georgia',serif}
header.hero p{margin:8px 0 0; opacity:.92; font-size:15px; max-width:640px}
.progress{height:8px; background:rgba(255,255,255,.3); border-radius:99px; overflow:hidden; margin-top:18px}
.progress > span{display:block; height:100%; width:0; background:#fff; border-radius:99px; transition:width .35s ease}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:22px 22px 20px; margin-top:22px; box-shadow:0 6px 22px -16px rgba(34,48,31,.35)}
.qnum{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--accent-dark);
  background:var(--accent-soft); padding:4px 10px; border-radius:99px; margin-bottom:10px}
.qtext{font-size:17px; font-weight:600; margin:0 0 14px}
.qtext .blank{display:inline-block; width:68px; height:1.05em; border-bottom:2px solid var(--ink); margin:0 2px; vertical-align:-0.12em}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:12px;
  padding:12px 14px; cursor:pointer; transition:border-color .15s, background .15s, transform .05s; font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.995)}
.opt .mk{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto;
  display:grid; place-items:center; font-size:13px; color:#fff; font-weight:700}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.correct{border-color:var(--correct); background:var(--correct-bg)}
.opt.correct .mk{background:var(--correct); border-color:var(--correct)}
.opt.wrong{border-color:var(--wrong); background:var(--wrong-bg)}
.opt.wrong .mk{background:var(--wrong); border-color:var(--wrong)}
.opt.locked{cursor:default}
.fill{display:flex; flex-direction:column; gap:14px; margin-top:4px}
.fillgroup{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--accent-soft)}
.fillgrp-title{font-size:13px; font-weight:700; color:var(--accent-dark); margin-bottom:8px; letter-spacing:.02em}
.fillrow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:7px 0}
.fillrow label{font-size:14.5px; font-weight:600}
.fillin{width:130px; font:inherit; font-size:15px; padding:8px 10px; border:1.5px solid var(--line);
  border-radius:10px; text-align:right; background:#fff; color:var(--ink)}
.fillin:focus{outline:none; border-color:var(--accent)}
.fillin.locked{cursor:default; background:#f6f8f6}
.fillin.correct{border-color:var(--correct); background:var(--correct-bg)}
.fillin.wrong{border-color:var(--wrong); background:var(--wrong-bg)}
.feedback{margin-top:14px; padding:14px 16px; border-radius:12px; font-size:14.5px; display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--correct-bg); border:1px solid #b6dcb6; color:#1d3a1d}
.feedback.no{background:var(--wrong-bg); border:1px solid #e3b6b6; color:#5b1d1d}
.feedback b{font-weight:700}
.bar{display:flex; gap:12px; margin-top:30px; align-items:center; flex-wrap:wrap}
button.check, button.submit{
  font:inherit; font-weight:600; border:none; border-radius:11px; padding:12px 22px; cursor:pointer;
  background:var(--accent); color:#fff; box-shadow:0 8px 20px -10px var(--accent); transition:filter .15s, transform .05s}
button.check:hover, button.submit:hover{filter:brightness(1.06)}
button.check:active, button.submit:active{transform:translateY(1px)}
button.check:disabled{background:#b9c7b4; box-shadow:none; cursor:default}
button.submit{background:var(--accent-dark); box-shadow:0 8px 20px -10px var(--accent-dark)}
.summary{display:none; margin-top:26px; background:linear-gradient(120deg,var(--accent-dark),var(--accent)); color:#fff;
  border-radius:18px; padding:28px; text-align:center}
.summary.show{display:block}
.summary .score{font-size:46px; font-weight:800; line-height:1}
.summary .score small{font-size:18px; font-weight:600; opacity:.8}
.summary .msg{margin-top:10px; font-size:15px; opacity:.95}
.summary .break{margin-top:16px; font-size:13.5px; opacity:.85}
.opts.multi .opt .mk{border-radius:4px}
footer{text-align:center; color:var(--muted); font-size:12.5px; margin-top:40px}
</style>
</head><body>
<header class="hero"><div class="inner">
  <p class="kicker">CSD 303 - Unit 2</p>
  <h1>Practice Problem Set</h1>
  <div class="progress"><span id="prog"></span></div>
</div></header>
<div class="wrap">
  <div id="quiz"></div>
  <div class="bar" style="justify-content:center"><button class="submit" id="submit">Submit quiz</button></div>
  <div class="summary" id="summary"></div>
</div>
<script>
const Q = [
  {
    q: "Soramimi and mondegreens are examples of... (choose all that apply)",
    options:[
      "homophonic translation",
      "top-down processing",
      "lexical effects in speech perception",
      "categorical perception",
    ],
    answers: [0, 1, 2],
  },
  {
    q: "If the y-axis label is '% t response', listeners' phoneme identification curve will shift toward the ___ in a /daʃ/-/taʃ/ (dash–TASH) continuum.",
    options:[
      "word end",
      "nonword end",
      "center",
      "high-frequency end only",
    ],
    answer: 1,
  },
  {
    q: "Categorical perception means: between-category discrimination is ___, within-category discrimination is ___.",
    options:[
      "good / poor",
      "poor / good",
      "impossible / impossible",
      "perfect / perfect",
    ],
    answer: 0,
  },
  {
    q: "What happens when a hiccup replaces one of the phonemes in your sentence?",
    options:[
      "Your friends still hear the intended phoneme because your top-down linguistic knowledge masks the hiccup.",
      "Your friends won't notice any phoneme missing.",
      "Only speech-language pathologists can restore the missing phoneme.",
      "Your friends will laugh because it sounds like a gap with a hiccup",
    ],
    answer: 1,
  },
  {
    q: "In the Yanny/Laurel spectrogram confusion, the low-quality recording makes it plausible that F3 is mistaken for...",
    options:[
      "F1",
      "F2",
      "the fundamental frequency",
      "silence",
    ],
    answer: 1,
  },
  {
    q: "Whistled languages are...",
    options:[
      "invented codes for communication with wild animals",
      "whistled versions of an existing spoken language",
      "created by aliens",
      "musical sounds of the language for entertainment",
    ],
    answer: 1,
  },
  {
    q: "Consider the two-tube vocal-tract model shown below (c = 34,000 cm/s). Calculate the three lowest resonance frequencies of the back cavity and of the front cavity, then list the formants F1, F2, F3 of the whole vocal tract (the vowel). Enter frequencies in Hz (round to the nearest whole number).",
    fig: `<img src="tube_figure.png" alt="Two-tube vocal tract model: back cavity 6 cm, front cavity 10 cm" style="max-width:480px;width:auto;height:auto;display:block;margin:2px auto 10px">`,
    type: "fill",
    fields: [
      {group:"Back cavity resonances", label:"Back f1 (Hz)", answer:1417},
      {group:"Back cavity resonances", label:"Back f2 (Hz)", answer:4251},
      {group:"Back cavity resonances", label:"Back f3 (Hz)", answer:7085},
      {group:"Front cavity resonances", label:"Front f1 (Hz)", answer:850},
      {group:"Front cavity resonances", label:"Front f2 (Hz)", answer:2550},
      {group:"Front cavity resonances", label:"Front f3 (Hz)", answer:4250},
      {group:"vowel formants", label:"Vowel F1 (Hz)", answer:850},
      {group:"vowel formants", label:"Vowel F2 (Hz)", answer:1417},
      {group:"vowel formants", label:"Vowel F3 (Hz)", answer:2550},
    ],
  },
  {
    q: "What format do you want quiz 4 to be?",
    options:[
      "a practice quiz",
      "a normal quiz"
    ],
    survey: true // UNGRADED SURVEY QUESTION (Recorded in Database, Excluded from Grade)
  },
];

const answered = new Array(Q.length).fill(false);
const iscorrect = new Array(Q.length).fill(false);
const userResponses = new Array(Q.length).fill(null); // Stores exact choices for database analysis
const root = document.getElementById('quiz');
const prog = document.getElementById('prog');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function blankify(s){return esc(s).replace(/_{2,}/g, '<span class="blank"></span>');}

Q.forEach((q, qi)=>{
  const isMulti = Array.isArray(q.answers);
  const card = document.createElement('div'); 
  card.className = 'card' + (isMulti ? ' multi' : '');
  let body;
  
  if(q.type === 'fill'){
    let html = '<div class="fill">'; let cur = null;
    q.fields.forEach((f,i)=>{
      if(f.group !== cur){
        if(cur !== null) html += '</div>';
        html += `<div class="fillgroup"><div class="fillgrp-title">${esc(f.group)}</div>`;
        cur = f.group;
      }
      html += `<div class="fillrow"><label>${esc(f.label)}</label><input class="fillin" type="number" step="any" inputmode="numeric" data-k="${i}" placeholder="Hz"></div>`;
    });
    html += '</div></div>';
    body = html;
  } else {
    let opts = q.options.map((o,i)=>`
    <div class="opt" data-i="${i}">
      <span class="mk">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>
    </div>`).join('');
    body = `<div class="opts${isMulti?' multi':''}">${opts}</div>`;
  }
  
  card.innerHTML = `<span class="qnum">Question ${qi+1}${q.survey ? ' (Survey Question)' : ''}</span>
    <p class="qtext">${blankify(q.q)}</p>
    ${q.fig||''}
    ${body}
    <div class="bar"><button class="check">Check answer</button></div>
    <div class="feedback"></div>`;
  root.appendChild(card);
  
  const btn = card.querySelector('.check');
  const fb = card.querySelector('.feedback');
  
  if(q.type === 'fill'){
    btn.addEventListener('click', ()=>{
      if(answered[qi]) return;
      const inputs = [...card.querySelectorAll('.fillin')];
      let allOk = true; let exp = [];
      const values = [];
      inputs.forEach(inp=>{
        const k = +inp.dataset.k; const ans = q.fields[k].answer;
        const v = parseFloat(inp.value);
        values.push(v);
        const ok = !isNaN(v) && Math.abs(v - ans) <= 40;
        inp.disabled = true; inp.classList.add('locked');
        if(ok){ inp.classList.add('correct'); }
        else { inp.classList.add('wrong'); allOk = false; exp.push(q.fields[k].label+' = '+ans+' Hz'); }
      });
      answered[qi] = true; 
      iscorrect[qi] = allOk; 
      userResponses[qi] = values;
      btn.disabled = true;
      fb.className = 'feedback show ' + (allOk?'ok':'no');
      if(allOk){
        fb.innerHTML = '<b>Correct!</b>' + (q.explain ? ' ' + esc(q.explain) : '');
      } else {
        fb.innerHTML = '<b>Not quite.</b> Expected values: ' + exp.map(e=>esc(e)).join('; ') + '.' + (q.explain ? ' ' + esc(q.explain) : '');
      }
      updateProg();
    });
  } else if(isMulti) {
    const correctSet = q.answers.slice().sort((a,b)=>a-b);
    const optEls = [...card.querySelectorAll('.opt')];
    const sel = new Set();
    
    optEls.forEach(el=>{
      el.addEventListener('click', ()=>{
        if(answered[qi]) return;
        const i = +el.dataset.i;
        if(sel.has(i)){ sel.delete(i); el.classList.remove('sel'); }
        else { sel.add(i); el.classList.add('sel'); }
        btn.disabled = sel.size === 0;
      });
    });
    
    btn.disabled = true;
    btn.addEventListener('click', ()=>{
      if(answered[qi] || sel.size === 0) return;
      answered[qi] = true;
      const chosen = [...sel].sort((a,b)=>a-b);
      userResponses[qi] = chosen;
      const ok = chosen.length === correctSet.length && chosen.every((v,idx)=>v===correctSet[idx]);
      iscorrect[qi] = ok;
      
      optEls.forEach((el,i)=>{
        el.classList.add('locked');
        const isCorr = correctSet.indexOf(i) !== -1;
        if(isCorr) el.classList.add('correct');
        if(sel.has(i) && !isCorr) el.classList.add('wrong');
      });
      
      btn.disabled = true;
      fb.className = 'feedback show ' + (ok?'ok':'no');
      if(ok){
        fb.innerHTML = '<b>Correct!</b>' + (q.explain ? ' ' + esc(q.explain) : '');
      } else {
        const letters = correctSet.map(i=>String.fromCharCode(65+i)).join(', ');
        fb.innerHTML = '<b>Not quite.</b> Correct choice(s): ' + letters + '.' + (q.explain ? ' ' + esc(q.explain) : '');
      }
      updateProg();
    });
  } else {
    // Single choice options
    const optEls = [...card.querySelectorAll('.opt')];
    let picked = -1;
    
    optEls.forEach(el=>{
      el.addEventListener('click', ()=>{
        if(answered[qi]) return;
        optEls.forEach(e=>e.classList.remove('sel'));
        el.classList.add('sel'); 
        picked = +el.dataset.i; 
        btn.disabled = false;
      });
    });
    
    btn.disabled = true;
    btn.addEventListener('click', ()=>{
      if(picked < 0 || answered[qi]) return;
      answered[qi] = true;
      userResponses[qi] = picked; // Save index selected (e.g. 0 or 1)
      
      if(q.survey) {
        // UNGRADED / SURVEY QUESTION LOGIC
        optEls.forEach((el, i)=>{
          el.classList.add('locked');
          if(i === picked) el.classList.add('correct');
        });
        btn.disabled = true;
        fb.className = 'feedback show ok';
        fb.innerHTML = '<b>Response recorded!</b> Thank you for your feedback.';
      } else {
        // GRADED QUESTION LOGIC
        const ok = picked === q.answer;
        iscorrect[qi] = ok;
        optEls.forEach((el,i)=>{
          el.classList.add('locked');
          if(i === q.answer) el.classList.add('correct');
          if(i === picked && i !== q.answer) el.classList.add('wrong');
        });
        btn.disabled = true;
        fb.className = 'feedback show ' + (ok?'ok':'no');
        fb.innerHTML = (ok? '<b>Correct!</b>' : '<b>Not quite.</b>') + (q.explain ? ' ' + esc(q.explain) : '');
      }
      updateProg();
    });
  }
});

function updateProg(){
  const done = answered.filter(Boolean).length;
  prog.style.width = (done/Q.length*100)+'%';
}

const submit = document.getElementById('submit');
const summary = document.getElementById('summary');
submit.addEventListener('click', ()=>{
  // Calculate score ONLY over non-survey questions
  const gradedQuestions = Q.filter(q => !q.survey);
  let correct = 0;
  Q.forEach((q, i) => {
    if(!q.survey && iscorrect[i]) correct++;
  });
  const pct = Math.round(correct / gradedQuestions.length * 100);

  // === AUTOMATIC LOGGING TO FIREBASE ===
  const FIREBASE_URL = "https://csd303-practiceproblem3-default-rtdb.firebaseio.com/submissions.json";
  fetch(FIREBASE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      timestamp: new Date().toISOString(),
      score: correct,
      total: gradedQuestions.length,
      percentage: pct,
      iscorrect: iscorrect,
      userResponses: userResponses // <-- STORES RAW SELECTIONS (e.g., 0 or 1 for question 8)
    })
  }).catch(err => console.error("Firebase error:", err));
  // =====================================

  summary.className='summary show';
  let msg = pct===100? "Flawless - you've got this material cold."
          : pct>=80? "Strong work. Review the ones you missed and you're set."
          : pct>=60? "Solid base - revisit the feedback on the missed items."
          : "Worth another pass through the materials";
  summary.innerHTML = `<div class="score">${correct}<small> / ${gradedQuestions.length}</small></div>
    <div class="msg">${msg}</div>
    <div class="break">${pct}% correct</div>`;
  summary.scrollIntoView({behavior:'smooth'});
});
</script>
</body></html>
